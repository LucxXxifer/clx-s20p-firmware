name: S20P locked B 25.12 candidate
run-name: S20P B 9f397975 · 10-17 baseline · ${{ github.run_number }}

on:
  schedule:
    # GitHub schedules use UTC: 20:20 UTC = next day 04:20 Asia/Shanghai.
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s20p-locked-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      publish_candidate: ${{ steps.build.outputs.publish_candidate }}
      artifact_digest: ${{ steps.upload_candidate.outputs['artifact-digest'] }}
    steps:
      - name: Checkout build policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run focused policy tests
        run: |
          python3 -m unittest discover -s ci/tests -v
          bash ci/tests/test_network.sh
          bash -n ci/build.sh ci/capture.sh ci/setup-runner.sh build.sh
      - name: Install reviewed runner dependencies
        run: bash ci/setup-runner.sh
      - name: Build and preserve same-build outputs
        id: build
        run: bash ci/build.sh
      - name: Audit all evidence before upload
        if: ${{ always() && !cancelled() }}
        id: audit
        run: |
          if [[ -d output ]]; then
            bash ci/capture.sh --audit-output "$PWD/output"
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload build evidence
        if: ${{ always() && !cancelled() && steps.audit.outputs.safe == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s20p-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/bin/
            output/public-keys/
            output/host-tools/
            output/metadata/
            output/provenance/
            output/reports/
            output/logs/
            output/inspection/kernel.fit
            output/inspection/board.dtb
            output/inspection/rootfs.squashfs
            output/inspection/installed-packages.json
            output/inspection/fwtool-metadata.json
            output/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload validated candidate bundle
        id: upload_candidate
        if: ${{ success() && steps.build.outputs.publish_candidate == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s20p-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release/
          if-no-files-found: error
          retention-days: 30

  publish-b-prerelease:
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.publish_candidate == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/s20p-b-25-12' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the exact wrapper commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact run artifact and prepare release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_BUILD_COMMIT: ${{ github.sha }}
          GH_EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          artifact_name="s20p-candidate-${GH_RUN_ID}-${GH_RUN_ATTEMPT}"
          api="repos/${GH_REPO}/actions/runs/${GH_RUN_ID}/artifacts"
          response=$(gh api "$api")
          matches=$(jq --arg name "$artifact_name" --arg run "$GH_RUN_ID" --arg sha "$GH_BUILD_COMMIT" \
            '[.artifacts[] | select(.name == $name and .expired == false and
              (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha)]' <<<"$response")
          [[ $(jq 'length' <<<"$matches") == 1 ]]
          artifact_id=$(jq -er '.[0].id' <<<"$matches")
          api_digest=$(jq -er '.[0].digest' <<<"$matches")
          [[ $api_digest =~ ^sha256:[0-9a-f]{64}$ ]]
          expected_digest="${GH_EXPECTED_ARTIFACT_DIGEST#sha256:}"
          [[ $expected_digest =~ ^[0-9a-f]{64}$ ]]
          [[ $api_digest == "sha256:$expected_digest" ]]
          artifact_zip="$RUNNER_TEMP/s20p-candidate-${GH_RUN_ID}-${GH_RUN_ATTEMPT}.zip"
          artifact_dir="$RUNNER_TEMP/s20p-candidate-${GH_RUN_ID}-${GH_RUN_ATTEMPT}"
          assets_dir="$RUNNER_TEMP/s20p-b-release-${GH_RUN_ID}-${GH_RUN_ATTEMPT}"
          gh api "repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" > "$artifact_zip"
          python3 ci/release_candidate.py verify-artifact-zip "$artifact_zip" "$artifact_dir" \
            --api-digest "$api_digest" --run-id "$GH_RUN_ID" --run-attempt "$GH_RUN_ATTEMPT"
          python3 ci/release_candidate.py prepare "$artifact_dir" "$assets_dir" \
            --run-id "$GH_RUN_ID" --run-attempt "$GH_RUN_ATTEMPT" --build-commit "$GH_BUILD_COMMIT"
          python3 ci/release_candidate.py verify "$assets_dir" \
            --run-id "$GH_RUN_ID" --run-attempt "$GH_RUN_ATTEMPT" --build-commit "$GH_BUILD_COMMIT"
          printf '%s\n' "$assets_dir" > "$RUNNER_TEMP/s20p-b-assets-dir"
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          assets_dir=$(cat "$RUNNER_TEMP/s20p-b-assets-dir")
          (cd "$assets_dir" && sha256sum -c SHA256SUMS)
          tag="s20p-b-25.12-candidate-${GH_RUN_ID}-${GH_RUN_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          S20P B 25.12 prerelease candidate. Candidate assets were checked against the same-run GitHub artifact digest, ZIP CRC, internal checksums, source pins, signed feeds, image metadata, ABI and preservation report.

          This is not a stable release. Live hardware boot and migration have not been validated. Lucky and its LuCI packages are excluded to avoid an unavailable source archive. The signed iStore feed offers Lucky packages for S20P architecture, but its core version is older than the captured baseline; configuration migration and runtime compatibility are unverified.

          The release contains a directly flashable S20P sysupgrade .bin, the complete same-build evidence archive, checksums, build verification metadata and installation instructions. It is not bit-identical to the historical image.
          NOTES
          shopt -s nullglob
          assets=("$assets_dir"/*)
          [[ ${#assets[@]} == 6 ]]
          gh release create "$tag" "${assets[@]}" --target "$GH_BUILD_COMMIT" \
            --title "S20P B 25.12 candidate ${GH_RUN_ID}.${GH_RUN_ATTEMPT}" \
            --notes-file release-notes.md --prerelease --latest=false
